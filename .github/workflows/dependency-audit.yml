name: PAW resolved dependency audit

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Resolve installed base dependencies and audit pinned versions
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys
          import venv

          root = Path(os.environ["RUNNER_TEMP"])
          runtime = root / "paw-audited"
          venv.create(runtime, with_pip=True)
          python = runtime / ("Scripts/python.exe" if os.name == "nt" else "bin/python")
          subprocess.run([python, "-m", "pip", "install", "."], check=True)
          pins = root / "paw-resolved.txt"
          with pins.open("w", encoding="utf-8") as output:
              subprocess.run([python, "-m", "pip", "list", "--format=freeze", "--exclude", "paw",
                              "--disable-pip-version-check"], stdout=output, check=True)
          subprocess.run([sys.executable, "-m", "pip", "install", "pip-audit==2.10.1"], check=True)
          subprocess.run([sys.executable, "-m", "pip_audit", "--strict", "--disable-pip", "--no-deps",
                          "-r", pins, "--format", "json", "--output", root / "paw-advisories.json"], check=True)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/paw-resolved.txt
            ${{ runner.temp }}/paw-advisories.json
