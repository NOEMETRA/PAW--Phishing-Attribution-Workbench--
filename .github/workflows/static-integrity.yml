name: PAW static integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile project sources
        run: python -m compileall -q paw
      - name: Check public metadata and safety wording
        run: python -m unittest discover -s tests -p 'test_static_contracts.py' -v
      - name: Verify Python requirement and sources in the actual built wheel
        run: python tests/integration_wheel_metadata_real.py
      - name: Install evidence hashing dependency
        run: python -m pip install 'blake3>=1.0.0,<2.0.0' 'dnspython>=2.4.2,<3.0.0' 'tldextract>=5,<6' 'dkimpy>=1.1.4,<2' 'cryptography>=42,<47' 'psutil>=5.9,<8' 'beautifulsoup4>=4.12,<5'
      - name: Verify execution and evidence contracts
        run: python -m unittest discover -s tests -p 'test_execution_contracts.py' -v
      - name: Verify authentication and missing evidence contracts
        run: python -m unittest discover -s tests -p 'test_authentication_contracts.py' -v
      - name: Verify bounded local DKIM key evidence and unverified provenance
        run: python -m unittest discover -s tests -p 'test_dkim_key_evidence.py' -v

      - name: Verify mailbox display-name parsing and structured field defects
        run: python -m unittest discover -s tests -p 'test_header_identity_contracts.py' -v

      - name: Verify bounded ordered top-level header inventory contracts
        run: python -m unittest discover -s tests -p 'test_header_inventory.py' -v

      - name: Verify structured Reply-To domains and comparison uncertainty
        run: python -m unittest discover -s tests -p 'test_reply_domain_contracts.py' -v

      - name: Verify scoped Received IP evidence and unverified receiver boundary
        run: python -m unittest discover -s tests -p 'test_received_contracts.py' -v

      - name: Verify adjacent timestamp claims and neutral relay observations
        run: python -m unittest discover -s tests -p 'test_received_timing_contracts.py' -v

      - name: Verify content observations cannot infer safety or authorize actions
        run: python -m unittest discover -s tests -p 'test_content_contracts.py' -v

      - name: Verify score contributions, unrounded decisions and numeric contracts
        run: python -m unittest discover -s tests -p 'test_scoring_contracts.py' -v

      - name: Verify text preservation and comparison-only deobfuscation observations
        run: python -m unittest discover -s tests -p 'test_deobfuscation_contracts.py' -v

      - name: Verify original HTML markup, bounded candidates and descriptive coverage
        run: python -m unittest discover -s tests -p 'test_html_contracts.py' -v

      - name: Verify JavaScript source preservation and unexecuted bounded candidates
        run: python -m unittest discover -s tests -p 'test_javascript_contracts.py' -v

      - name: Verify MIME and attachment evidence contracts
        run: python -m unittest discover -s tests -p 'test_mime_contracts.py' -v

      - name: Verify per-part body byte evidence and charset provenance
        run: python -m unittest discover -s tests -p 'test_mime_body_evidence.py' -v

      - name: Verify URL identity, candidate provenance and decoding bounds
        run: python -m unittest discover -s tests -p 'test_url_contracts.py' -v

      - name: Verify real process supervision and interrupted evidence
        run: python -m unittest discover -s tests -p 'test_runtime_contracts.py' -v

      - name: Install local API contract dependencies
        run: python -m pip install 'fastapi>=0.104,<1' 'python-multipart>=0.0.9,<1'
      - name: Verify queue cancellation races
        run: python -m unittest discover -s tests -p 'test_gui_contracts.py' -v
      - name: Verify crash recovery and no-egress process launch paths
        run: python -m unittest discover -s tests -p 'test_recovery_contracts.py' -v

      - name: Verify batch, numeric inputs, export and local integrity regressions
        run: python -m unittest discover -s tests -p 'test_engine_contracts.py' -v
      - name: Install dependencies for the real offline CLI and HTTP API check
        run: python -m pip install 'requests>=2.31,<3' 'rich>=13.7,<14' 'ipwhois>=1.2,<2' 'python-dateutil>=2.8.2,<3' 'uvicorn>=0.24,<1'
      - name: Verify real CLI/API shared ownership, concurrent readers and CLI crash
        run: python tests/integration_cli_api_real.py

      - name: Verify case identity collisions cannot overwrite real offline evidence
        run: python tests/integration_case_identity_real.py
      - name: Verify legacy inbox launcher uses actual supervised offline full analysis
        run: python tests/integration_legacy_inbox_real.py
      - name: Verify legacy canary rejection preserves actual offline case evidence
        run: python tests/integration_canary_boundary_real.py
      - name: Verify real signed offline CLI and HTTP analyses with supplied key snapshots
        run: python tests/integration_dkim_keys_real.py
      - name: Verify real offline CLI URL evidence and coverage
        run: python tests/integration_url_evidence_real.py
      - name: Verify real offline full CLI content observations and actions
        run: python tests/integration_content_assessment_real.py

      - name: Verify real offline HTML markup, candidate evidence and descriptive coverage
        run: python tests/integration_html_evidence_real.py

      - name: Verify real offline JavaScript evidence and explicit unassessed risk
        run: python tests/integration_javascript_evidence_real.py

      - name: Verify real offline mailbox identity and header-field coverage
        run: python tests/integration_header_identity_real.py

      - name: Verify real offline domain comparisons and persisted scoring parity
        run: python tests/integration_reply_domain_real.py

      - name: Verify real offline Received IP provenance and descriptive categories
        run: python tests/integration_received_real.py

      - name: Verify real offline Received timing observations and score parity
        run: python tests/integration_received_timing_real.py

      - name: Verify domain Unicode representation and unavailable script analysis
        run: python -m unittest discover -s tests -p 'test_domain_unicode_contracts.py' -v

      - name: Verify real offline Unicode and ACE spelling observations
        run: python tests/integration_domain_unicode_real.py

      - name: Verify display brand and public registrable label contracts
        run: python -m unittest discover -s tests -p 'test_display_brand_contracts.py' -v

      - name: Verify actual offline display brand comparisons
        run: python tests/integration_display_brand_real.py

      - name: Verify bounded domain brand comparison contracts
        run: python -m unittest discover -s tests -p 'test_domain_brand_contracts.py' -v

      - name: Verify actual offline domain-label comparisons
        run: python tests/integration_domain_brand_real.py

      - name: Verify normalized TLD observations and From availability
        run: python -m unittest discover -s tests -p 'test_tld_contracts.py' -v

      - name: Verify actual offline TLD observations and scoring
        run: python tests/integration_tld_real.py

      - name: Verify nullable domain age and future timestamp rejection
        run: python -m unittest discover -s tests -p 'test_domain_age_contracts.py' -v

      - name: Verify actual offline domain-age coverage and nullable index
        run: python tests/integration_domain_age_real.py

      - name: Verify supplied whole-day ages in scorer and real SQLite index
        run: python -m unittest discover -s tests -p 'test_domain_age_inputs.py' -v

      - name: Verify RDAP object binding and registration-event selection
        run: python -m unittest discover -s tests -p 'test_rdap_registration.py' -v

      - name: Verify actual loopback HTTP registration collector and no-egress skip
        run: python tests/integration_rdap_registration_real.py

      - name: Verify header SimHash vectors and legacy SQLite compatibility
        run: python -m unittest discover -s tests -p 'test_simhash_contracts.py' -v

      - name: Verify actual offline header fingerprints and CLI HTTP queries
        run: python tests/integration_simhash_real.py

      - name: Verify lossless bounded standalone deobfuscation input contracts
        run: python -m unittest discover -s tests -p 'test_deobfuscate_input.py' -v

      - name: Verify actual standalone input rejection and offline observations
        run: python tests/integration_deobfuscate_input_real.py

      - name: Verify read-only CLI queries and case shutdown admission
        run: python -m unittest discover -s tests -p 'test_query_read_contracts.py' -v

      - name: Verify actual standalone worker containment and deadlines
        run: python -m unittest discover -s tests -p 'test_standalone_runtime.py' -v

      - name: Verify actual CLI HTTP workers ignore analysis-directory Python shadows
        run: python tests/integration_worker_imports_real.py

      - name: Verify actual offline header inventory and sealed HTTP exports
        run: python tests/integration_header_inventory_real.py

      - name: Verify actual offline MIME body evidence and sealed HTTP exports
        run: python tests/integration_mime_body_evidence_real.py

      - name: Verify bounded MIME tree header inventories
        run: python -m unittest discover -s tests -p 'test_mime_header_inventory.py' -v

      - name: Verify actual offline MIME tree headers and sealed HTTP exports
        run: python tests/integration_mime_header_inventory_real.py

      - name: Verify bounded attachment ZIP inventories and coverage
        run: python -m unittest discover -s tests -p 'test_archive_inventory.py' -v

      - name: Verify actual offline attachment ZIP inventories and exports
        run: python tests/integration_archive_inventory_real.py

      - name: Verify original embedded MIME spans and separate derived evidence
        run: python -m unittest discover -s tests -p 'test_embedded_wire_evidence.py' -v

      - name: Verify actual offline embedded MIME bytes and sealed exports
        run: python tests/integration_embedded_wire_real.py

      - name: Verify bounded links from existing URLs to outer-message sources
        run: python -m unittest discover -s tests -p 'test_url_sources.py' -v

      - name: Verify actual offline URL source links and sealed exports
        run: python tests/integration_url_sources_real.py

      - name: Verify bounded MIME CID candidate relationships and scopes
        run: python -m unittest discover -s tests -p 'test_mime_cid.py' -v

      - name: Verify actual offline MIME CID cases and sealed API exports
        run: python tests/integration_mime_cid_real.py

      - name: Verify bounded static captured-kit observations and unavailable attribution
        run: python -m unittest discover -s tests -p 'test_kit_static.py' -v

      - name: Verify supplied HTML form provenance, bounds and unverified matrix consumption
        run: python -m unittest discover -s tests -p 'test_form_observations.py' -v

      - name: Verify supplied tracker-pattern and log provenance, shared bounds and matrix consumption
        run: python -m unittest discover -s tests -p 'test_tracker_observations.py' -v

      - name: Verify passive Received descriptions and unavailable header-forgery assessment
        run: python -m unittest discover -s tests -p 'test_header_forgery_contracts.py' -v

      - name: Verify actual Sentinel SQLite rows across fresh and partial migrations
        run: python -m unittest discover -s tests -p 'test_sentinel_database_rows.py' -v

      - name: Verify Sentinel passive admission and unmigrated saved rows
        run: python -m unittest discover -s tests -p 'test_sentinel_passive_open.py' -v

      - name: Verify actual passive Sentinel CLI list and storage preservation
        run: python tests/integration_sentinel_passive_real.py

      - name: Verify stored Sentinel JSON sources and explicit decoding outcomes
        run: python -m unittest discover -s tests -p 'test_sentinel_json_evidence.py' -v

      - name: Verify actual Sentinel stored counts and explicit instance-flag scope
        run: python -m unittest discover -s tests -p 'test_sentinel_status.py' -v

      - name: Verify actual passive Sentinel CLI status and unavailable runtime state
        run: python tests/integration_sentinel_status_real.py

      - name: Verify actual stored Sentinel forensic export and independent digest
        run: python -m unittest discover -s tests -p 'test_sentinel_forensic_export.py' -v

      - name: Verify fresh-process passive Sentinel export and default writer admission
        run: python tests/integration_sentinel_export_real.py

      - name: Verify selected Sentinel intelligence sources and unavailable interpretations
        run: python -m unittest discover -s tests -p 'test_sentinel_intelligence_report.py' -v

      - name: Verify actual passive intelligence JSON in fresh processes
        run: python tests/integration_sentinel_intelligence_real.py

      - name: Verify complete stored geographic sources and passive report outputs
        run: python -m unittest discover -s tests -p 'test_sentinel_geographic_report.py' -v

      - name: Verify actual geographic CLI and cold API admission without collection
        run: python tests/integration_sentinel_geographic_real.py

      - name: Verify complete interaction labels and unavailable identity interpretations
        run: python -m unittest discover -s tests -p 'test_sentinel_interaction_statistics.py' -v

      - name: Verify actual cold passive interaction API and saved JSON sources
        run: python tests/integration_sentinel_interaction_real.py

      - name: Verify typed stored filters and unavailable recency/correlation
        run: python -m unittest discover -s tests -p 'test_sentinel_stored_filters.py' -v

      - name: Verify actual cold stored filter/statistics APIs and source preservation
        run: python tests/integration_sentinel_stored_filters_real.py

      - name: Verify actual unavailable Sentinel CLI lifecycle before source access
        run: python tests/integration_sentinel_lifecycle_real.py

      - name: Verify local Sentinel file-reader ownership admission
        run: python -m unittest discover -s tests -p 'test_sentinel_local_files.py' -v

      - name: Verify actual local-file CLI checks preserve unrelated Sentinel sources
        run: python tests/integration_sentinel_local_files_real.py

      - name: Verify offline campaign argument admission and actual stored mutations
        run: python tests/integration_sentinel_campaign_real.py

      - name: Verify legacy campaign listing matches passive CLI without source mutation
        run: python tests/integration_legacy_campaign_list_real.py

      - name: Verify complete passive legacy interaction diagnostic and source admission
        run: python tests/integration_legacy_interaction_check_real.py

      - name: Verify legacy origin updater rejects without touching actual offline evidence
        run: python tests/integration_legacy_origin_update_real.py

      - name: Verify legacy abuse publisher rejection preserves supervised local review drafts
        run: python tests/integration_legacy_abuse_draft_real.py

  archive-runtime-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install offline engine and loopback API test dependencies
        run: python -m pip install 'blake3>=1,<2' 'dnspython>=2.4.2,<3' 'tldextract>=5,<6' 'dkimpy>=1.1.4,<2' 'cryptography>=42,<47' 'psutil>=5.9,<8' 'beautifulsoup4>=4.12,<5' 'fastapi>=0.104,<1' 'python-multipart>=0.0.9,<1' 'requests>=2.31,<3' 'rich>=13.7,<14' 'ipwhois>=1.2,<2' 'python-dateutil>=2.8.2,<3' 'uvicorn>=0.24,<1'
      - name: Verify Unicode ZIP parser views and bounded name accounting
        run: python -m unittest discover -s tests -p 'test_archive_inventory.py' -v
      - name: Verify actual offline Unicode ZIP CLI and HTTP exports
        run: python tests/integration_archive_inventory_real.py
