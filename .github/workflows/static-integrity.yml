      - name: Verify actual offline Unicode ZIP CLI and HTTP exports
        run: python tests/integration_archive_inventory_real.py
      - name: Verify shared HTML text boundaries on maintenance runtimes
        run: python -m unittest discover -s tests -p 'test_html_text_contexts.py' -v
      - name: Verify independent HTML observer coverage on maintenance runtimes
        run: python -B -m unittest discover -s tests -p 'test_html_observer_coverage.py' -v
      - name: Verify residual consumer views on maintenance runtimes
        run: python -B -m unittest discover -s tests -p 'test_consumer_views.py' -v
      - name: Verify attachment capability and report coverage on maintenance runtimes
        run: python -B -m unittest discover -s tests -p 'test_attachment_capabilities.py' -v
      - name: Verify actual attachment capability CLI HTTP and ZIP on maintenance runtimes
        run: python -B tests/integration_attachment_capabilities_real.py
